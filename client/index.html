<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>三国杀 · 联机版</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- ========== 大厅 ========== -->
  <div id="lobby-screen">
    <div class="lobby-header">
      <h1 class="lobby-title">三国杀</h1>
      <p class="lobby-subtitle">联机版 · 正统身份局</p>
    </div>

    <div class="lobby-panels">
      <!-- 创建房间 -->
      <div class="lobby-card">
        <h3>创建房间</h3>
        <div class="form-row">
          <label>你的名字</label>
          <input id="input-name" type="text" maxlength="6" placeholder="输入昵称" value="">
        </div>
        <div class="form-row">
          <label>房间人数</label>
          <div class="player-count-select">
            <input id="input-max-players" type="range" min="2" max="10" value="5">
            <span id="player-count-display">5</span>
          </div>
        </div>
        <button id="btn-create-room" class="action-btn primary" style="width:100%">创建房间</button>
      </div>

      <!-- 加入房间 -->
      <div class="lobby-card">
        <h3>加入房间</h3>
        <div class="form-row">
          <label>房间号</label>
          <input id="input-room-id" type="text" maxlength="4" placeholder="输入4位房间号" style="text-transform:uppercase;letter-spacing:4px">
        </div>
        <button id="btn-join-room" class="action-btn" style="width:100%">加入房间</button>
      </div>
    </div>

    <!-- 房间内 -->
    <div id="room-panel" class="hidden">
      <div class="room-info-bar">
        <span>房间 <strong id="room-id-display"></strong></span>
        <span id="room-player-count">0</span>/<span id="room-max-display">0</span> 人
        <button id="btn-leave-room" class="action-btn" style="padding:4px 12px;font-size:13px">离开</button>
      </div>
      <div id="room-player-list" class="room-players"></div>
      <div id="room-ai-row" class="hidden" style="display:flex;gap:8px;margin-top:6px">
        <button id="btn-add-ai" class="action-btn" style="flex:1;padding:6px;font-size:13px">＋ 添加AI</button>
      </div>
      <button id="btn-start-game" class="action-btn primary hidden" style="width:100%;margin-top:8px">开始游戏</button>
    </div>

    <div id="lobby-error" class="hidden"></div>
  </div>

  <!-- ========== 游戏界面 ========== -->
  <div id="game-screen" class="hidden">
    <!-- 顶部信息栏 -->
    <header id="top-bar">
      <div class="game-title">三国杀</div>
      <div class="game-info">
        <span id="phase-display">等待中</span>
        <span id="turn-display">第 0 回合</span>
      </div>
      <div class="top-actions">
        <span id="online-count" style="margin-right:8px">0</span>
        <button id="btn-quit-game" class="top-btn" title="退出房间">退出</button>
        <button id="btn-restart-game" class="top-btn hidden" title="重新开局">重开</button>
      </div>
    </header>

    <!-- 座位区（动态生成） -->
    <section id="seating-area"></section>

    <!-- 中央区 -->
    <section id="center-area">
      <div class="piles">
        <div id="deck-pile" class="pile"><div class="pile-label">牌堆</div><div class="pile-count">0</div></div>
        <div id="discard-pile" class="pile"><div class="pile-label">弃牌堆</div><div class="pile-count">0</div></div>
      </div>
      <div id="game-log"><div class="log-entry system">等待游戏开始...</div></div>
    </section>

    <!-- 己方角色区 -->
    <section id="self-area">
      <div id="self-avatar">
        <div class="avatar-frame"><span class="avatar-placeholder">?</span></div>
        <div class="self-info">
          <div class="self-name">我</div>
          <div class="self-hero"></div>
          <div class="self-identity-tag"></div>
        </div>
        <div id="self-health-bar">
          <div id="self-health-dots"></div>
          <div id="self-hp-text">4/4</div>
        </div>
      </div>
    </section>

    <!-- 手牌区 -->
    <section id="hand-area">
      <div id="hand-header">
        <span id="hand-count">手牌: 0</span>
        <span id="hand-hint"></span>
      </div>
      <div id="hand-cards" class="hand-cards"><div class="card-placeholder">等待发牌...</div></div>
    </section>

    <!-- 操作按钮区 -->
    <footer id="action-bar">
      <button id="btn-skill" class="action-btn hidden">技能</button>
      <button id="btn-end-play" class="action-btn hidden">结束出牌</button>
      <button id="btn-confirm-discard" class="action-btn hidden">确认弃牌</button>
      <button id="btn-confirm-skill" class="action-btn hidden">确认</button>
      <button id="btn-cancel-skill" class="action-btn hidden">取消</button>
    </footer>

    <!-- 响应提示条 -->
    <div id="prompt-bar" class="hidden">
      <span id="prompt-message"></span>
      <div id="prompt-buttons"></div>
    </div>

    <!-- 聊天 -->
    <div id="chat-area">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" maxlength="50" placeholder="聊天...">
        <button id="chat-send">发送</button>
      </div>
    </div>

    <!-- 游戏结束 -->
    <div id="gameover-overlay" class="hidden">
      <div class="gameover-box">
        <h2 id="gameover-title"></h2>
        <p id="gameover-detail"></p>
        <button id="restart-btn" class="action-btn primary">返回大厅</button>
      </div>
    </div>
  </div>

  <script src="js/game-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
